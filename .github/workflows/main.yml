name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Publier le rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          retention-days: 14

      - name: Verifier le keystore
        id: ks
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "has=${KS:+yes}" >> "$GITHUB_OUTPUT"

      - name: Restaurer le keystore
        if: steps.ks.outputs.has == 'yes'
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > keystore.jks

      - name: Construire l'APK signe
        if: steps.ks.outputs.has == 'yes'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Construire l'APK debug
        if: steps.ks.outputs.has != 'yes'
        run: gradle :app:assembleDebug --no-daemon

      - name: Isoler l'APK unique
        run: |
          mapfile -t found < <(find app/build/outputs/apk -name '*.apk' | sort)
          echo "APK trouves : ${#found[@]}"
          printf '%s\n' "${found[@]}"
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Attendu 1 APK, obtenu ${#found[@]}"
            exit 1
          fi
          mkdir -p out
          cp "${found[0]}" out/MedTap-Flo.apk
          ls -lh out/MedTap-Flo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedTap-Flo
          path: out/MedTap-Flo.apk
          retention-days: 90

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MedTap v1.0.${{ github.run_number }}
          body: |
            APK unique. Ouvre ce lien sur le telephone et touche MedTap-Flo.apk pour installer.
          files: out/MedTap-Flo.apk
          make_latest: true
